name: API Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-tests
    strategy:
      fail-fast: false
      matrix:
        bugs-tier: [off, easy, medium, hard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"

      - run: pip install -r requirements.txt

      - run: |
          pytest --bugs-tier=${{ matrix.bugs-tier }} \
            --html=report-${{ matrix.bugs-tier }}.html --self-contained-html
        env:
          CANDIDATE_ID: maxi-ci-${{ matrix.bugs-tier }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.bugs-tier }}
          path: api-tests/report-${{ matrix.bugs-tier }}.html
